<!-- index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>俄罗斯方块</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#0a0a1a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:'Segoe UI',system-ui,sans-serif;
    color:#e0e0e0;
    user-select:none;
    -webkit-user-select:none;
  }
  #app{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  #game-container{
    display:flex;
    gap:18px;
    align-items:flex-start;
  }
  #game-canvas{
    border:2px solid #3a3a5c;
    border-radius:4px;
    background:#000;
    box-shadow:0 0 20px rgba(80,80,180,0.3);
  }
  #info-panel{
    background:#12122a;
    border:1px solid #2a2a4a;
    border-radius:8px;
    padding:16px 20px;
    min-width:130px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  #info-panel .label{
    font-size:12px;
    color:#888;
    text-transform:uppercase;
    letter-spacing:2px;
    margin-top:2px;
  }
  #info-panel .value{
    font-size:22px;
    font-weight:700;
    color:#fff;
    font-variant-numeric:tabular-nums;
  }
  #info-panel .next-label{
    font-size:12px;
    color:#888;
    text-transform:uppercase;
    letter-spacing:2px;
    margin-top:10px;
    text-align:center;
  }
  #next-canvas{
    background:#000;
    border:1px solid #2a2a4a;
    border-radius:4px;
    display:block;
    margin:0 auto;
  }
  #controls{
    display:flex;
    gap:12px;
  }
  button{
    padding:10px 24px;
    font-size:15px;
    font-weight:600;
    border:none;
    border-radius:6px;
    cursor:pointer;
    letter-spacing:1px;
    transition:all .15s;
  }
  #start-btn{background:#1a6b3c;color:#fff}
  #start-btn:hover{background:#1f8047}
  #pause-btn{background:#8a6d00;color:#fff}
  #pause-btn:hover{background:#a88400}
  #restart-btn{background:#6b1a3c;color:#fff}
  #restart-btn:hover{background:#801f47}
  button:active{transform:scale(0.96)}
  #game-over-overlay{
    display:none;
    position:fixed;
    top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,0.82);
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:100;
  }
  #game-over-overlay .box{
    background:#1a1a3a;
    border:2px solid #4a4a7a;
    border-radius:12px;
    padding:32px 48px;
    text-align:center;
  }
  #game-over-overlay h2{
    font-size:28px;
    color:#ff4466;
    margin-bottom:12px;
  }
  #game-over-overlay p{
    font-size:18px;
    margin-bottom:20px;
    color:#ccc;
  }
  #game-over-overlay button{
    background:#4466ff;
    color:#fff;
    font-size:16px;
    padding:10px 28px;
  }
  #game-over-overlay button:hover{background:#5577ff}
  #hint{
    font-size:11px;
    color:#555;
    text-align:center;
    line-height:1.6;
  }
</style>
</head>
<body>
<div id="app">
  <div id="game-container">
    <canvas id="game-canvas" width="200" height="400"></canvas>
    <div id="info-panel">
      <span class="label">分数</span>
      <span class="value" id="score-val">0</span>
      <span class="label">等级</span>
      <span class="value" id="level-val">1</span>
      <span class="label">行数</span>
      <span class="value" id="lines-val">0</span>
      <span class="next-label">▶ NEXT</span>
      <canvas id="next-canvas" width="100" height="100"></canvas>
    </div>
  </div>
  <div id="controls">
    <button id="start-btn">开 始</button>
    <button id="pause-btn">暂 停</button>
    <button id="restart-btn">重 开</button>
  </div>
  <div id="hint">← → 移动 &nbsp; ↑ 旋转 &nbsp; ↓ 软降 &nbsp; 空格 硬降</div>
</div>
<div id="game-over-overlay">
  <div class="box">
    <h2>游戏结束</h2>
    <p>最终得分: <b id="final-score">0</b></p>
    <button id="overlay-restart-btn">重新开始</button>
  </div>
</div>

<script src="js/constants.js"></script>
<script src="js/state.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
</body>
</html>
