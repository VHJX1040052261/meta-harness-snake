<!-- index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <div class="header">
      <div class="score-panel">
        <span class="label">当前得分</span>
        <span id="score" class="value">0</span>
      </div>
      <div class="score-panel">
        <span class="label">最高分</span>
        <span id="highScore" class="value">0</span>
      </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="overlay" class="overlay hidden">
      <div id="overlayText" class="overlay-text"></div>
      <button id="overlayBtn" class="btn">开始游戏</button>
    </div>
    <div class="controls">
      <button id="btnUp" class="ctrl-btn">▲</button>
      <div class="ctrl-row">
        <button id="btnLeft" class="ctrl-btn">◀</button>
        <button id="btnDown" class="ctrl-btn">▼</button>
        <button id="btnRight" class="ctrl-btn">▶</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
