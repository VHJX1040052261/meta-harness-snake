<!-- T05: 汇总验证脚本 — 引用 T01 共享状态，对所有产物做完整性检查 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>T05_Verify</title></head>
<body>
<script>
// T05 — 汇总验证：引用 T01 共享状态中的桌面路径，对文件执行存在性 + 内容完整性检查
const fs = require('fs');
const path = require('path');

const SHARED_STATE_FILE = '/tmp/meta_harness_shared_state.json';

// ★ 读取 T01 共享状态获取已验证的桌面路径
let desktopPath;
let t01State = null;
try {
  t01State = JSON.parse(fs.readFileSync(SHARED_STATE_FILE, 'utf8'));
  desktopPath = t01State.desktop_path;
} catch (e) {
  console.log(JSON.stringify({
    T05_output: {
      status: 'TEST_FAILED',
      reason: `无法读取 T01 共享状态: ${e.message}`,
      shared_state_file: SHARED_STATE_FILE,
      timestamp: new Date().toISOString()
    }
  }));
  process.exit(1);
}

// 前置防护: 若 T01 报告桌面路径不可用，直接判定失败
if (!t01State.path_exists) {
  console.log(JSON.stringify({
    T05_output: {
      status: 'TEST_FAILED',
      reason: `T01 报告桌面路径不可用: ${desktopPath}`,
      t01_path_exists: t01State.path_exists,
      t01_path_writable: t01State.path_writable,
      t01_timestamp: t01State.timestamp,
      timestamp: new Date().toISOString()
    }
  }));
  process.exit(1);
}

const requiredFiles = [
  { name: 'V_Role_Profile.txt', minBytes: 100 },
  { name: 'H_Role_Profile.txt', minBytes: 100 },
  { name: 'J_Role_Profile.txt', minBytes: 100 }
];

const results = [];
let allPassed = true;

for (const file of requiredFiles) {
  const fullPath = path.join(desktopPath, file.name);
  const entry = {
    file: file.name,
    path: fullPath,
    desktop_source: 'T01_shared_state'
  };

  // 检查1: 文件存在性
  try {
    fs.accessSync(fullPath, fs.constants.R_OK);
    entry.exists = true;
  } catch (e) {
    entry.exists = false;
    entry.error = 'FILE_NOT_FOUND';
    allPassed = false;
    results.push(entry);
    continue;
  }

  // 检查2: 文件大小 >= minBytes
  const stat = fs.statSync(fullPath);
  entry.size_bytes = stat.size;

  if (stat.size < file.minBytes) {
    entry.nonEmpty = false;
    entry.error = `FILE_TOO_SMALL (${stat.size} < ${file.minBytes} bytes)`;
    allPassed = false;
    results.push(entry);
    continue;
  }

  // 检查3: 首行内容非空
  const content = fs.readFileSync(fullPath, 'utf8');
  const firstLine = content.split('\n')[0].trim();
  entry.first_line = firstLine.substring(0, 80);
  entry.nonEmpty = firstLine.length > 0;

  if (!entry.nonEmpty) {
    entry.error = 'FIRST_LINE_EMPTY';
    allPassed = false;
  }

  results.push(entry);
}

const verdict = {
  status: allPassed ? 'TEST_PASSED' : 'TEST_FAILED',
  desktop_path: desktopPath,
  desktop_source: 'T01_shared_state',
  t01_path_exists: t01State.path_exists,
  files_checked: results.length,
  files_passed: results.filter(r => r.exists && r.nonEmpty).length,
  details: results,
  shared_memory_update: 'V/H/J 三角色档案已模板化，后续迭代只需修改 operations 细节',
  timestamp: new Date().toISOString()
};

console.log(JSON.stringify({ T05_output: verdict }));

// 退出码：PASS=0, FAIL=1
process.exit(allPassed ? 0 : 1);
</script>
</body>
</html>
